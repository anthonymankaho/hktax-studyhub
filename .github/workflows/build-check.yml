name: build-check

on: [push, pull_request]

jobs:
  index-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index.html
        run: python scripts/build-combined.py
      - name: Fail if the committed index.html is stale
        run: git diff --exit-code -- index.html

  qwen-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Qwen Worker tests
        run: node --test worker/test/qwen.test.js

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MCP worker dependencies
        working-directory: mcp
        run: npm install
      - name: MCP tests against hub sources
        working-directory: mcp
        run: npm test
